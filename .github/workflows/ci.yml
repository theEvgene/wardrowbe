name: CI

on:
  workflow_dispatch:
    inputs:
      run_model_calibration:
        description: Run the real ONNX model against the licensed photo corpus
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff linter
        run: |
          cd backend
          ruff check .

      - name: Run Ruff formatter check
        run: |
          cd backend
          ruff format --check .

      - name: Check migration heads
        run: python backend/scripts/check_migration_heads.py

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/wardrobe_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          STORAGE_PATH: /tmp/wardrobe
        run: |
          cd backend
          pytest -v --tb=short

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/wardrobe_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          STORAGE_PATH: /tmp/wardrobe
        run: |
          cd backend
          pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      # Missing translation keys and unwrapped strings are invisible to tsc, eslint and vitest,
      # because t() takes a plain string. Without this step they only surface as raw key paths
      # in front of a user.
      - name: i18n check
        run: |
          cd frontend
          npm run i18n:check

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm test -- --run

      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:coverage -- --run
        continue-on-error: true

  frontend-e2e:
    name: Frontend Browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build production frontend
        run: |
          cd frontend
          npm run build

      - name: Run browser happy path
        run: |
          cd frontend
          npm run test:e2e

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          push: false
          tags: wardrowbe/backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          push: false
          tags: wardrowbe/frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke backend image
        run: >-
          docker run --rm --entrypoint python wardrowbe/backend:test
          -c "from app.main import app; assert app"

      - name: Smoke frontend image
        run: |
          docker run --detach --name wardrowbe-frontend-smoke \
            --publish 3000:3000 \
            --env BACKEND_URL=http://127.0.0.1:8000 \
            --env NEXTAUTH_URL=http://127.0.0.1:3000 \
            --env NEXTAUTH_SECRET=ci-runtime-smoke-secret \
            wardrowbe/frontend:test
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs wardrowbe-frontend-smoke
          exit 1

      - name: Stop runtime smoke containers
        if: always()
        run: docker rm --force wardrowbe-frontend-smoke 2>/dev/null || true

  model-calibration:
    name: Licensed Real-photo Model Calibration
    if: github.event_name == 'workflow_dispatch' && inputs.run_model_calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build model image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          push: false
          tags: wardrowbe/backend:calibration
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Run strict licensed calibration baseline
        run: >-
          docker run --rm --entrypoint python
          --volume "${{ github.workspace }}/backend/tests/fixtures/garment_calibration:/fixtures:ro"
          wardrowbe/backend:calibration
          -m scripts.calibrate_garment_extraction --fixtures /fixtures --strict
